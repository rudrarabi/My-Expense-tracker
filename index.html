<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আমার খরচ ট্র্যাকার</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0d0d0d">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0d0d0d;
    color: #f0f0f0;
    padding: 16px;
  }
  header {
    text-align: center;
    padding: 20px 0;
  }
  header h1 {
    font-size: 22px;
    color: #4ade80;
  }
  .card {
    background: #1a1a1a;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid #2a2a2a;
  }
  label {
    display: block;
    margin-bottom: 6px;
    color: #aaa;
    font-size: 14px;
  }
  input, select {
    width: 100%;
    padding: 12px;
    margin-bottom: 16px;
    background: #0d0d0d;
    border: 1px solid #333;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
  }
  button {
    width: 100%;
    padding: 14px;
    background: #4ade80;
    color: #000;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  .expense-item {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid #2a2a2a;
  }
  .expense-item:last-child { border-bottom: none; }
  .expense-amount {
    color: #f87171;
    font-weight: bold;
    white-space: nowrap;
  }
  .total {
    text-align: center;
    font-size: 20px;
    padding: 16px;
    background: #1a1a1a;
    border-radius: 12px;
    margin-bottom: 16px;
  }
  .error-msg {
    color: #f87171;
    font-size: 14px;
    margin-bottom: 12px;
    display: none;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .top-bar span {
    color: #aaa;
    font-size: 14px;
  }
  .top-bar button {
    width: auto;
    padding: 8px 16px;
    background: #2a2a2a;
    color: #f87171;
    font-size: 13px;
  }
  .hidden { display: none !important; }
  .switch-link {
    text-align: center;
    margin-top: 12px;
    font-size: 14px;
    color: #4ade80;
    cursor: pointer;
    text-decoration: underline;
  }
  .loading {
    text-align: center;
    color: #777;
    padding: 40px 0;
  }
  .empty-msg {
    text-align: center;
    color: #777;
    padding: 20px 0;
    font-size: 14px;
  }
  .banner {
    width: calc(100% + 32px);
    display: block;
    margin: -16px -16px 0 -16px;
  }
  @keyframes glowPulse {
    0% { box-shadow: 0 0 0px rgba(74, 222, 128, 0.8); }
    50% { box-shadow: 0 0 25px 8px rgba(74, 222, 128, 0.9); }
    100% { box-shadow: 0 0 0px rgba(74, 222, 128, 0.8); }
  }
  .glow-effect {
    animation: glowPulse 0.7s ease;
  }
</style>
</head>
<body>

<img src="./banner.jpg" alt="খরচ ট্র্যাকার ব্যানার" class="banner">

<header>
  <h1>💰 আমার খরচ ট্র্যাকার</h1>
</header>

<div id="loadingScreen" class="loading">লোড হচ্ছে...</div>

<div id="authScreen" class="hidden">
  <div class="card">
    <h3 id="authTitle" style="margin-bottom:16px; text-align:center;">লগইন করুন</h3>
    <div id="errorMsg" class="error-msg"></div>
    <label>ইমেইল</label>
    <input type="email" id="authEmail" placeholder="you@example.com">
    <label>পাসওয়ার্ড</label>
    <input type="password" id="authPassword" placeholder="কমপক্ষে ৬ অক্ষর">
    <button id="authSubmitBtn" onclick="handleAuthSubmit()">লগইন করুন</button>
    <div class="switch-link" id="switchModeLink" onclick="toggleAuthMode()">অ্যাকাউন্ট নেই? সাইন আপ করুন</div>
  </div>
</div>

<div id="appScreen" class="hidden">
  <div class="top-bar">
    <span id="userEmailDisplay"></span>
