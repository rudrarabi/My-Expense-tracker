<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আমার খরচ ট্র্যাকার</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0d0d0d;
    color: #f0f0f0;
    padding: 16px;
  }
  header {
    text-align: center;
    padding: 20px 0;
  }
  header h1 {
    font-size: 22px;
    color: #4ade80;
  }
  .card {
    background: #1a1a1a;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid #2a2a2a;
  }
  label {
    display: block;
    margin-bottom: 6px;
    color: #aaa;
    font-size: 14px;
  }
  input, select {
    width: 100%;
    padding: 12px;
    margin-bottom: 16px;
    background: #0d0d0d;
    border: 1px solid #333;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
  }
  button {
    width: 100%;
    padding: 14px;
    background: #4ade80;
    color: #000;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
  }
  .expense-item {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid #2a2a2a;
  }
  .expense-amount {
    color: #f87171;
    font-weight: bold;
  }
  .total {
    text-align: center;
    font-size: 20px;
    padding: 16px;
    background: #1a1a1a;
    border-radius: 12px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<header>
  <h1>💰 আমার খরচ ট্র্যাকার</h1>
</header>

<div class="total">
  মোট খরচ: <span id="totalAmount">৳ 0.00</span>
</div>

<div class="card">
  <label>খরচের তারিখ</label>
  <input type="date" id="expenseDate">

  <label>পরিমাণ (৳)</label>
  <input type="number" id="expenseAmount" placeholder="0.00">

  <label>ক্যাটাগরি</label>
  <select id="expenseCategory">
    <option>খাবার</option>
    <option>যাতায়াত</option>
    <option>বিল</option>
    <option>কেনাকাটা</option>
    <option>বিনোদন</option>
    <option>অন্যান্য</option>
  </select>

  <label>নোট</label>
  <input type="text" id="expenseNote" placeholder="যেমন: দুপুরের খাবার">

  <button onclick="addExpense()">➕ খরচ যোগ করুন</button>
</div>

<div class="card">
  <h3 style="margin-bottom:12px;">সাম্প্রতিক খরচ</h3>
  <div id="expenseList"></div>
</div>

<script>
  let expenses = [];

  function addExpense() {
    const date = document.getElementById('expenseDate').value;
    const amount = parseFloat(document.getElementById('expenseAmount').value);
    const category = document.getElementById('expenseCategory').value;
    const note = document.getElementById('expenseNote').value;

    if (!amount || amount <= 0) {
      alert('সঠিক পরিমাণ লিখুন');
      return;
    }

    expenses.push({ date, amount, category, note });
    renderExpenses();

    document.getElementById('expenseAmount').value = '';
    document.getElementById('expenseNote').value = '';
  }

  function renderExpenses() {
    const list = document.getElementById('expenseList');
    list.innerHTML = '';
    let total = 0;

    expenses.slice().reverse().forEach(exp => {
      total += exp.amount;
      const item = document.createElement('div');
      item.className = 'expense-item';
      item.innerHTML = `
        <div>
          <div>${exp.category} ${exp.note ? '- ' + exp.note : ''}</div>
          <div style="font-size:12px;color:#777;">${exp.date || ''}</div>
        </div>
        <div class="expense-amount">৳ ${exp.amount.toFixed(2)}</div>
      `;
      list.appendChild(item);
    });

    document.getElementById('totalAmount').innerText = '৳ ' + total.toFixed(2);
  }
</script>

</body>
</html>
