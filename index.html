<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আমার খরচ ট্র্যাকার</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0d0d0d;
    color: #f0f0f0;
    padding: 16px;
  }
  header {
    text-align: center;
    padding: 20px 0;
  }
  header h1 {
    font-size: 22px;
    color: #4ade80;
  }
  .card {
    background: #1a1a1a;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid #2a2a2a;
  }
  label {
    display: block;
    margin-bottom: 6px;
    color: #aaa;
    font-size: 14px;
  }
  input, select {
    width: 100%;
    padding: 12px;
    margin-bottom: 16px;
    background: #0d0d0d;
    border: 1px solid #333;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
  }
  button {
    width: 100%;
    padding: 14px;
    background: #4ade80;
    color: #000;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  .expense-item {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid #2a2a2a;
  }
  .expense-item:last-child { border-bottom: none; }
  .expense-amount {
    color: #f87171;
    font-weight: bold;
    white-space: nowrap;
  }
  .total {
    text-align: center;
    font-size: 20px;
    padding: 16px;
    background: #1a1a1a;
    border-radius: 12px;
    margin-bottom: 16px;
  }
  .error-msg {
    color: #f87171;
    font-size: 14px;
    margin-bottom: 12px;
    display: none;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .top-bar span {
    color: #aaa;
    font-size: 14px;
  }
  .top-bar button {
    width: auto;
    padding: 8px 16px;
    background: #2a2a2a;
    color: #f87171;
    font-size: 13px;
  }
  .hidden { display: none !important; }
  .switch-link {
    text-align: center;
    margin-top: 12px;
    font-size: 14px;
    color: #4ade80;
    cursor: pointer;
    text-decoration: underline;
  }
  .loading {
    text-align: center;
    color: #777;
    padding: 40px 0;
  }
  .empty-msg {
    text-align: center;
    color: #777;
    padding: 20px 0;
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <h1>💰 আমার খরচ ট্র্যাকার</h1>
</header>

<div id="loadingScreen" class="loading">লোড হচ্ছে...</div>

<div id="authScreen" class="hidden">
  <div class="card">
    <h3 id="authTitle" style="margin-bottom:16px; text-align:center;">লগইন করুন</h3>
    <div id="errorMsg" class="error-msg"></div>
    <label>ইমেইল</label>
    <input type="email" id="authEmail" placeholder="you@example.com">
    <label>পাসওয়ার্ড</label>
    <input type="password" id="authPassword" placeholder="কমপক্ষে ৬ অক্ষর">
    <button id="authSubmitBtn" onclick="handleAuthSubmit()">লগইন করুন</button>
    <div class="switch-link" id="switchModeLink" onclick="toggleAuthMode()">অ্যাকাউন্ট নেই? সাইন আপ করুন</div>
  </div>
</div>

<div id="appScreen" class="hidden">
  <div class="top-bar">
    <span id="userEmailDisplay"></span>
    <button onclick="logout()">লগ আউট</button>
  </div>
  <div class="total">
    মোট খরচ: <span id="totalAmount">৳ 0.00</span>
  </div>
  <div class="card">
    <label>খরচের তারিখ</label>
    <input type="date" id="expenseDate">
    <label>পরিমাণ (৳)</label>
    <input type="number" id="expenseAmount" placeholder="0.00">
    <label>ক্যাটাগরি</label>
    <select id="expenseCategory">
      <option>খাবার</option>
      <option>যাতায়াত</option>
      <option>বিল</option>
      <option>কেনাকাটা</option>
      <option>বিনোদন</option>
      <option>অন্যান্য</option>
    </select>
    <label>নোট</label>
    <input type="text" id="expenseNote" placeholder="যেমন: দুপুরের খাবার">
    <button onclick="addExpense()">➕ খরচ যোগ করুন</button>
  </div>
  <div class="card">
    <h3 style="margin-bottom:12px;">সাম্প্রতিক খরচ</h3>
    <div id="expenseList"></div>
    <div id="emptyMsg" class="empty-msg hidden">এখনো কোনো খরচ যোগ করা হয়নি</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, query, where, orderBy,
    onSnapshot, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBhFXA4sQyNtZXNXliuVYTO1fmBUqiamyY",
    authDomain: "expenses-tracker-986fb.firebaseapp.com",
    projectId: "expenses-tracker-986fb",
    storageBucket: "expenses-tracker-986fb.firebasestorage.app",
    messagingSenderId: "456862444493",
    appId: "1:456862444493:web:2f985ae9e47eba78b93284"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let isSignUpMode = false;
  let currentUser = null;
  let unsubscribeExpenses = null;

  window.toggleAuthMode = function() {
    isSignUpMode = !isSignUpMode;
    document.getElementById('authTitle').innerText = isSignUpMode ? 'সাইন আপ করুন' : 'লগইন করুন';
    document.getElementById('authSubmitBtn').innerText = isSignUpMode ? 'সাইন আপ করুন' : 'লগইন করুন';
    document.getElementById('switchModeLink').innerText = isSignUpMode ? 'আগে থেকে অ্যাকাউন্ট আছে? লগইন করুন' : 'অ্যাকাউন্ট নেই? সাইন আপ করুন';
    hideError();
  };

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.innerText = msg;
    el.style.display = 'block';
  }
  function hideError() {
    document.getElementById('errorMsg').style.display = 'none';
  }

  function friendlyError(code) {
    const map = {
      'auth/invalid-email': 'সঠিক ইমেইল দিন',
      'auth/user-not-found': 'এই ইমেইলে কোনো অ্যাকাউন্ট নেই',
      'auth/wrong-password': 'পাসওয়ার্ড ভুল হয়েছে',
      'auth/invalid-credential': 'ইমেইল বা পাসওয়ার্ড ভুল',
      'auth/email-already-in-use': 'এই ইমেইল দিয়ে আগেই অ্যাকাউন্ট আছে, লগইন করুন',
      'auth/weak-password': 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে',
    };
    return map[code] || 'কিছু একটা সমস্যা হয়েছে, আবার চেষ্টা করুন';
  }

  window.handleAuthSubmit = function() {
    hideError();
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if (!email || !password) {
      showError('ইমেইল ও পাসওয়ার্ড দিন');
      return;
    }
    const action = isSignUpMode
      ? createUserWithEmailAndPassword(auth, email, password)
      : signInWithEmailAndPassword(auth, email, password);
    action.catch(err => showError(friendlyError(err.code)));
  };

  window.logout = function() {
    signOut(auth);
  };

  onAuthStateChanged(auth, (user) => {
    document.getElementById('loadingScreen').classList.add('hidden');
    currentUser = user;
    if (user) {
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('appScreen').classList.remove('hidden');
      document.getElementById('userEmailDisplay').innerText = user.email;
      subscribeToExpenses(user.uid);
    } else {
      document.getElementById('appScreen').classList.add('hidden');
      document.getElementById('authScreen').classList.remove('hidden');
      if (unsubscribeExpenses) { unsubscribeExpenses(); unsubscribeExpenses = null; }
    }
  });

  window.addExpense = async function() {
    if (!currentUser) return;
    const date = document.getElementById('expenseDate').value;
    const amount = parseFloat(document.getElementById('expenseAmount').value);
    const category = document.getElementById('expenseCategory').value;
    const note = document.getElementById('expenseNote').value.trim();
    if (!amount || amount <= 0) {
      alert('সঠিক পরিমাণ লিখুন');
      return;
    }
    try {
      await addDoc(collection(db, 'expenses'), {
        uid: currentUser.uid,
        date: date || new Date().toISOString().split('T')[0],
        amount: amount,
        category: category,
        note: note,
        createdAt: serverTimestamp()
      });
      document.getElementById('expenseAmount').value = '';
      document.getElementById('expenseNote').value = '';
    } catch (err) {
      alert('খরচ সেভ করতে সমস্যা হয়েছে: ' + err.message);
    }
  };

  function subscribeToExpenses(uid) {
    if (unsubscribeExpenses) unsubscribeExpenses();
    const q = query(
      collection(db, 'expenses'),
      where('uid', '==', uid),
      orderBy('createdAt', 'desc')
    );
    unsubscribeExpenses = onSnapshot(q, (snapshot) => {
      const list = document.getElementById('expenseList');
      const emptyMsg = document.getElementById('emptyMsg');
      list.innerHTML = '';
      let total = 0;
      if (snapshot.empty) {
        emptyMsg.classList.remove('hidden');
      } else {
        emptyMsg.classList.add('hidden');
      }
      snapshot.forEach(doc => {
        const exp = doc.data();
        total += exp.amount;
        const item = document.createElement('div');
        item.className = 'expense-item';
        item.innerHTML = `
          <div>
            <div>${exp.category}${exp.note ? ' - ' + exp.note : ''}</div>
            <div style="font-size:12px;color:#777;">${exp.date || ''}</div>
          </div>
          <div class="expense-amount">৳ ${exp.amount.toFixed(2)}</div>
        `;
        list.appendChild(item);
      });
      document.getElementById('totalAmount').innerText = '৳ ' + total.toFixed(2);
    }, (err) => {
      console.error(err);
    });
  }
</script>

</body>
</html>
